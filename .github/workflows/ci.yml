name: CI

on:
  push:
  pull_request:

# Two rules, and the second was learned the hard way.
#
# Dedupe: a push to a branch with an open PR fires both `push` and `pull_request`, so without
# a shared group the same commit is built twice.
#
# Never cancel on main: with `cancel-in-progress: true` everywhere, consecutive pushes to main
# cancel each other. That happened — a commit's run was cancelled by the next push, and the
# re-run of the older commit then cancelled HEAD's run — leaving commits on main that were
# never actually verified while the branch looked green. Superseding a run is fine on a branch,
# where only the tip matters.
#
# `cancel-in-progress` accepts an expression, not just a literal (GitHub Actions workflow
# syntax, "Using concurrency"), which is what makes the split expressible in one group.
#
# What this does NOT buy: per-commit verification. A push fires one run, against the head
# commit only, so every earlier commit in a multi-commit push goes unverified — the
# concurrency split above fixes cancellation, not batching. **A commit that has to stand on
# its own has to be pushed on its own.** See ONDAR.md, "CI verifies the head of each push, not
# every commit".
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    # macOS only: the audio engine builds against CoreAudio, and this is the only
    # platform Ondar targets. No Linux/Windows matrix — see CLAUDE.md.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node; this action does not install Node itself.
      # No `version:` on purpose — it reads package.json's packageManager field, so the
      # lockfile, local installs and CI cannot drift onto different pnpm majors.
      - uses: pnpm/action-setup@v6
        with:
          cache: true

      # Matches the development machine (node -v => v26.8.1). Pinned to what Martín
      # actually runs rather than to the newest available: CI validating a major nobody
      # uses locally is a false signal in both directions.
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: dtolnay/rust-toolchain@stable

      # The Cargo workspace is at src-tauri/, not the repo root.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: cargo fmt
        working-directory: src-tauri
        run: cargo fmt --all --check

      # --workspace is load-bearing, as for cargo test below: without it clippy lints the
      # member crates' libraries only as the root's dependencies, and never their tests or
      # examples (C2b, 2026-09-28: three such targets had failed it unseen).
      - name: cargo clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # --workspace is load-bearing: src-tauri/Cargo.toml has a real [package] at its
      # root, so a bare `cargo test` runs only that package's own tests — while silently
      # skipping every member crate, which is where nearly all of the tests live.
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --workspace

      # Runs from the repo root, and deliberately after cargo test: ts-rs regenerates
      # src/bindings/ during the test run, so drifted committed bindings fail here.
      # `git diff` sees only tracked files; the status check also fails on a new
      # #[ts(export)] type whose generated .ts was never committed.
      - name: Bindings are up to date
        run: |
          git diff --exit-code src/bindings
          test -z "$(git status --porcelain src/bindings)"

      - name: pnpm typecheck
        run: pnpm typecheck

      # The renderer's own tests (vitest under jsdom, from M3b 1b): a separate step and a
      # separate count from `cargo test` — reported beside the Rust count, never summed (CLAUDE.md,
      # "Test counts").
      - name: pnpm test
        run: pnpm test

      - name: pnpm lint
        run: pnpm lint

      # cargo build, not `pnpm tauri build`: a full bundle is slow and pointless until
      # M6. The Natural Earth inputs (40 MB) never enter CI: the built map resource is
      # committed, and the build tool's input-bound tests are #[ignore]d.
      - name: cargo build
        working-directory: src-tauri
        run: cargo build
