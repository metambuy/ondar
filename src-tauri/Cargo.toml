[workspace]
members = [".", "crates/ondar-audio", "crates/ondar-stations", "crates/ondar-map", "crates/ondar-map-build"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

# The rules the compiler holds (2026-10-17, "enforce, don't document"; ONDAR.md "Repo tooling").
# Every member crate opts in with `[lints] workspace = true`; a crate differs only through a
# crate-root `#![allow]`, a site through `#[allow(lint, reason = "…")]`. The allow-list below is
# noise for this codebase, one reason each; everything else in `pedantic` is fixed in code.
[workspace.lints.rust]
# Allowed, not warned: CI's `-D warnings` would deny it (verified: only `--force-warn` keeps a
# warning, and Cargo's table cannot say that). Each crate flips to `#![deny(missing_docs)]` in the
# commit that documents it (docs/BUILD_PLAN.md, M5).
missing_docs = "allow"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
# nearly every pure fn; `#[must_use]` on getters buys nothing here
must_use_candidate = "allow"
# one error type per crate, documented where it is defined; a per-fn section repeats it
missing_errors_doc = "allow"
# a panic that can happen is a defect to fix, not a section to write (.claude/rules/rust.md)
missing_panics_doc = "allow"
# the session loop, the HLS task and app setup are sequences; splitting them for a count hides the order
too_many_lines = "allow"
# LAEA, clipping and orientation maths use the letters of the formulas they implement
many_single_char_names = "allow"

[package]
name = "ondar"
version = "0.1.0"
description = "Ondar — macOS menu bar radio player"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# The app, never a crates.io package; `cargo deny` treats an unpublished crate as ours.
publish = false

[lints]
workspace = true

[lib]
name = "ondar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["macos-private-api", "tray-icon"] }
# Subclasses the popover's NSWindow into a non-activating NSPanel — the only way to get a menu
# bar popover that takes key without activating the app or stealing focus from the frontmost
# one. Neither Tauri nor any crate already in the tree does this. Git-only with no release
# tracking the v2.1 API, so it is pinned by `rev`, never by branch; see ONDAR.md.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
# One running Ondar. LaunchServices refuses a second `open Ondar.app`, but it does NOT dedupe
# by identifier across paths: a copy of the bundle at another path starts a real second process
# (measured 2026-09-16, M2c Step 0 case (e)) — two tray icons and two audio engines without this.
# macOS mechanism is a Unix socket named after the identifier; 2.4.4 is the current 2.x
# (3.0.0-alpha.0 exists and is not taken). No feature flags: `semver` would add the version to
# the socket name, and Ondar wants one instance across versions.
tauri-plugin-single-instance = "2.4.4"
# The in-app update (M6-lite commit 4): on launch Rust checks the CrabNebula Cloud feed named in
# `tauri.conf.json` (`plugins.updater`), verifies the minisign signature of `Ondar.app.tar.gz`
# and swaps the bundle in place; the page only renders the prompt and reports the click. 2.13.3
# is the current 2.x (3.0.0-alpha.2 exists, not taken) and needs tauri 2.12 (commit 4a). No
# capability entry: the page never calls the plugin's own commands.
tauri-plugin-updater = "2.13.3"
# Already in the tree (tauri's async runtime is tokio); linked directly for `time::sleep`, the
# delay before the update check runs on that runtime (`updater.rs`). No other feature.
tokio = { version = "1", features = ["time"] }
ondar-audio = { path = "crates/ondar-audio" }
ondar-stations = { path = "crates/ondar-stations" }
# The map resource's loader (M4a commit 7); the store waits in `MapState` for M4b's commands.
ondar-map = { path = "crates/ondar-map" }
serde = { version = "1", features = ["derive"] }
# Generates the TypeScript for the shell's own boundary types (`PanelView`), the same way
# `ondar-audio` generates its IPC types: `#[ts(export)]` expands to a test that writes
# `src/bindings/*.ts` when `cargo test --workspace` runs. Same version and feature as the engine
# crate so one `TS_RS_EXPORT_DIR` serves both.
ts-rs = { version = "12", features = ["serde-compat"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Already in the tree via tracing-subscriber, stream-download and hyper-util; linked
# directly because implementing a tracing Filter needs `Event`/`Subscriber` by name.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# The file sink (M6-lite): a daily rolling file in the app log dir, pruned to seven files, so a
# Finder launch (which discards stderr) still leaves a log a tester can send. Neither std nor
# tracing-subscriber rotates or prunes files.
tracing-appender = "0.2.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
