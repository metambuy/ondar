[workspace]
members = [".", "crates/onda-audio"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[package]
name = "onda"
version = "0.1.0"
description = "Onda — macOS menu bar radio player"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "onda_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon"] }
# Subclasses the popover's NSWindow into a non-activating NSPanel — the only way to get a
# menu bar popover that does not steal focus from the frontmost app. No crates.io release
# tracks the v2.1 API, so it is pinned by rev; see ONDA.md.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "c9ec2130422200f0863b23dfdad02b133a529b07" }
onda-audio = { path = "crates/onda-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Already in the tree via tracing-subscriber, stream-download and hyper-util; linked
# directly because implementing a tracing Filter needs `Event`/`Subscriber` by name.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
