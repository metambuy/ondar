[workspace]
members = [".", "crates/ondar-audio"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "MIT"

[package]
name = "ondar"
version = "0.1.0"
description = "Ondar — macOS menu bar radio player"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "ondar_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
ondar-audio = { path = "crates/ondar-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
# Already in the tree via tracing-subscriber, stream-download and hyper-util; linked
# directly because implementing a tracing Filter needs `Event`/`Subscriber` by name.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
