# cargo-deny (0.20), run in CI and as a local gate: `cargo deny check` from src-tauri/
# (CLAUDE.md "Commands"; ONDAR.md "Repo tooling", 2026-10-18). Four checks, all four must pass:
# advisories (RustSec, including yanked crates), licenses (the allow-list below), bans (duplicate
# versions warn; a ban would be listed here), sources (crates.io plus the one git dependency).

[graph]
# macOS only (CLAUDE.md): the dependency graph of the two Apple targets, not every platform's.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
all-features = false

[advisories]
# A yanked crate is an advisory in effect: its author withdrew it.
yanked = "deny"
ignore = []

[licenses]
# The set the tree actually carried on 2026-10-18 (`cargo deny list -l license`), nothing
# speculative: a new license fails here and is added on purpose, with the crate that brings it.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CC0-1.0",
  "MIT-0",
  "0BSD",
]
confidence-threshold = 0.8
# tauri-nspanel (git, pinned by rev) has no `license` field; cargo-deny reads its LICENSE_MIT and
# LICENSE_APACHE-2.0 files and lists it as "Apache-2.0, MIT" (verified with `cargo deny list`),
# leaving a `no-license-field` warning, not a failure. No `[[licenses.clarify]]`: with a wrong
# file hash the entry is ignored silently (probed 2026-10-18), so one here could not be trusted.

[licenses.private]
# Our own crates are `publish = false` and inherit the workspace MIT; nothing to audit.
ignore = true

[bans]
# Warn, not deny: the ten duplicates on 2026-10-18 (base64 x3, getrandom x3, syn, png,
# miniz_oxide, indexmap, hashbrown, cpufeatures, core-foundation, bitflags) are all transitive
# through tauri and reqwest, and not ours to resolve. The count is in the log; a jump is a signal.
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The one git dependency, pinned by `rev` in Cargo.toml (CLAUDE.md "Known risks" 1).
allow-git = ["https://github.com/ahkohd/tauri-nspanel"]
