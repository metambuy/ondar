[package]
name = "ondar-audio"
version = "0.1.0"
description = "Ondar audio engine: HTTP stream → decode → EQ → output. No Tauri dependency."
edition.workspace = true
rust-version.workspace = true

[dependencies]
# Playback + Symphonia decoders. `mp4` = AAC codec + ADTS demuxer (most AAC radio), `mp3`, `vorbis`, `flac`.
rodio = { version = "0.22", default-features = false, features = ["playback", "mp3", "mp4", "vorbis", "flac", "wav"] }
# Buffered HTTP reader (Read + Seek) with bounded in-memory storage for live streams.
stream-download = { version = "0.24", default-features = false, features = ["reqwest", "reqwest-native-tls"] }
reqwest = { version = "0.13", default-features = false }
# Only for one downcast: the classifier walks a reqwest error's `source()` chain to the
# `hyper::Error` underneath and asks `is_parse()`, which is how a Shoutcast v1 `ICY 200 OK`
# status line is told apart from a network fault (M3a, G4a). A `dyn Error` chain cannot be
# matched on a type this crate cannot name. Already in the tree at the same version via
# reqwest; no new crate enters Cargo.lock.
hyper = { version = "1", default-features = false }
# `time` for the connect-phase bound (`tokio::time::timeout` around the headers phase, M3a G4b).
# `sync` + `macros` for HLS (M3c): the fetch task hands segments to the reader over a bounded
# `mpsc`, and `select!` is how every await in it also watches the receiver closing.
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "sync", "macros"] }
tokio-util = "0.7"
# HLS (M3c): `HlsSource` implements stream-download's `SourceStream`, which is a
# `futures_core::Stream` of `bytes::Bytes` — the trait names both, so the impl has to. Both are
# already in the tree at these versions through stream-download and reqwest; no new crate
# enters Cargo.lock.
futures-core = "0.3"
bytes = "1"
# HLS (M3c): a playlist's relative URIs are joined against the URL it was fetched from (RFC
# 3986 reference resolution — `../`, absolute paths, queries), which std has no notion of.
# Already in the tree at this version via ondar-stations' resolver; no new crate enters
# Cargo.lock.
url = "2"
# HLS (M3c): station 10 (Antena 1) serves its playlists gzip-compressed without being asked
# (`content-encoding: gzip` on a request with no `Accept-Encoding`), and the census's probe
# parsed the compressed bytes as playlist lines. Inflated by the response header, never
# requested — reqwest's `gzip` feature would add `Accept-Encoding` to every Icecast request
# too. Already in Cargo.lock at this version via tauri's icon codegen; no new crate enters the
# lock.
flate2 = "1"
# DSP
biquad = "0.6"
# Real-time-safe SPSC ring buffer between the decode thread and the audio callback.
rtrb = "0.4"
# Types shared with the UI
serde = { version = "1", features = ["derive"] }
ts-rs = { version = "12", features = ["serde-compat"] }
thiserror = "2"
log = "0.4"

[dev-dependencies]
# Only for the stall_bench example — a separate process, so it needs its own tracing
# subscriber to see stream-download's internal reconnect/retry logs (see src-tauri's
# lib.rs::run for why tracing-subscriber, not env_logger).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
