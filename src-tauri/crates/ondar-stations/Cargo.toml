[package]
name = "ondar-stations"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Station directory for Ondar: radio-browser.info client, normalisation, ranking, SQLite cache and store. No Tauri dependency."

[lints]
workspace = true

[dependencies]
# Types shared with the UI, exported by ts-rs exactly as ondar-audio does (`cargo test --workspace`
# writes src/bindings/ through .cargo/config.toml's TS_RS_EXPORT_DIR).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", features = ["serde-compat"] }
thiserror = "2"
log = "0.4"
# The HTTP client: the same TLS the engine uses (native-tls via stream-download). No gzip
# feature on purpose — radio-browser ignores Accept-Encoding (measured 2026-09-21, G6).
reqwest = { version = "0.13", default-features = false, features = ["native-tls"] }
# Server discovery through the system resolver (0.1.2, G): `getaddrinfo` and `getnameinfo`
# (`lookup_host`, `lookup_addr`), which std has only half of (`ToSocketAddrs`, forward only).
# 4.0.2 (2026-10-01, MIT/Apache); its libc, socket2 and cfg-if are already in the tree.
dns-lookup = "4.0.2"
# The country list's sort key (0.1.2, F4): NFD, to drop the accents a Latin letter carries. 2.3.0,
# already in the tree (url → idna → idna_adapter); no new package.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
# The service's fetch runtime (multi-thread, two workers), the retry backoff sleeps, and the
# discovery's `spawn_blocking` + `timeout` (`rt` is in `rt-multi-thread`).
tokio = { version = "1.52", features = ["rt-multi-thread", "time", "sync"] }
# The cache and store. `bundled` compiles SQLite in, so the bundle carries its own version and
# the tests run in-memory with no system library involved. 0.40.2 is the current release
# (2026-08-08). No other crate in the tree offers SQLite.
# `fallible_uint`: `usize`/`u64` parameters bind through rusqlite's own checked conversion
# (`Error::ToSqlConversionFailure` past i64::MAX) instead of an `as i64` at every call (2026-10-17).
rusqlite = { version = "0.40", features = ["bundled", "fallible_uint"] }
