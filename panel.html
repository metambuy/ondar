<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ondar popover</title>
    <!--
      The popover page: the React renderer, entered at `src/panel.tsx`. It invokes commands and
      mirrors events and decides nothing (CLAUDE.md, "The one rule"), and because it invokes,
      `capabilities/default.json` is scoped to this window.

      The transparent background is load-bearing. An opaque body paints over the
      NSVisualEffectView that `set_effects` inserts while `set_effects` still returns Ok, so the
      vibrancy would look broken while every check passed. Inline rather than in a stylesheet so
      it holds before any module has loaded.
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        height: 100%;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/panel.tsx"></script>
  </body>
</html>
